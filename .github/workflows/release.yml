name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test ./...
      - run: go build -o gidbams ./cmd/gidbams
      - name: Generate SHA256SUMS
        if: matrix.os == 'ubuntu-latest'
        run: |
          sha256sum gidbams > SHA256SUMS
          mv gidbams gidbams-linux
          sed -i 's/  gidbams$/  gidbams-linux/' SHA256SUMS
      - name: Rename binary (macos)
        if: matrix.os == 'macos-latest'
        run: mv gidbams gidbams-macos
      - name: Upload release assets (ubuntu)
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            gidbams-linux
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets (macos)
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: gidbams-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
