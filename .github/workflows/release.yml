name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test ./...
      - run: go build -o git-dbms ./cmd/git-dbms
      - uses: softprops/action-gh-release@v2
        with:
          files: git-dbms
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
EOF