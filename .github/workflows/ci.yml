name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: gofmt -l . | tee fmt.out
      - run: test ! -s fmt.out
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - run: go test ./internal/record/ -fuzz=FuzzParseFrontmatter -fuzztime=10s
