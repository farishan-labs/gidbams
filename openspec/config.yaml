schema: spec-driven

context: |
  Project: gidbams — git-as-a-source-of-truth database engine (Go).
  Tech stack: Go 1.26, cobra CLI, modernc.org/sqlite (pure Go, no CGO), MCP over stdio, HTTP server.
  Layout: cmd/gidbams (entry), internal/* (config, store, validate, sqlite, mcp, httpserver, cli, record, triggers, gitutil), pkg/gidbams (public embeddable API).
  Runtime data names (unchanged for compat): gitdb.yaml, .gitdb/, env vars now GIDBAMS_* (legacy GIT_DBMS_* accepted, deprecated).
  Module path: github.com/farishan-labs/gidbams. Binary: gidbams.
  Conventions: conventional commits, gofmt, go vet, race tests in CI, MIT license.
  Tests: go test ./..., fuzz on record parsing, integration tests in internal/cli and internal/httpserver and internal/mcp.
  CI: .github/workflows/ci.yml (green), .github/workflows/release.yml (broken — no releases published yet).
  Positioning: git-files-first SSOT + typed schemas + derived SQLite + MCP/CLI for agents + Go embedding; markdown-frontmatter records.

